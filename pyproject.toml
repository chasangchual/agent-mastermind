[project]
name = "mastermind"
version = "0.1.0"
description = "Interactive AI agent with a terminal user interface"
requires-python = ">=3.12"
dependencies = [
    "textual>=0.60",
    "langchain>=1.3",
    "langgraph>=1.2",
    "langfuse>=3.0",
    "langchain-openai>=1.4.1",
    "langchain-google-genai>=4.3.2",
    "langchain-ollama>=1.1.0",
]

[project.scripts]
mastermind = "mastermind.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "pyright>=1.1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"
